# Cloud Build: build Nikki's container and roll a new revision of the existing Cloud Run service.
# Only the image changes — service account, secrets, env vars, Cloud SQL and the GCS volume are
# kept from the current revision (they were set once by scripts/deploy.sh).
#
# Used by Nikki's own `deploy_self` engineer tool (gcloud builds submit --substitutions _TAG=<sha>-<ts>)
# and by scripts/deploy_now.sh. A GitHub-connected trigger can reuse it with _TAG=$SHORT_SHA.
substitutions:
  _REGION: us-east4
  _SERVICE: nikki
  _AR_REPO: nikki
  _TAG: manual

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:${_TAG}', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:${_TAG}']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', '${_SERVICE}', '--region', '${_REGION}', '--project', '$PROJECT_ID',
           '--image', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:${_TAG}', '--quiet']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:${_TAG}'

timeout: 1500s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
